<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aboriginal Experiences | Beyond the Highway</title>
<style>
  :root{--bg:#04140d;--green:#7CFF5C;--green-soft:#9bdc75;--soft:rgba(140,255,92,.28);--ink:#eafff0;--mut:#9fc4ad}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:
    radial-gradient(1200px 600px at 50% -10%,#0a2b1c 0%,var(--bg) 55%) fixed;color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 60px;min-height:100vh}
  a.back{display:inline-flex;align-items:center;gap:7px;margin:14px 2px 2px;padding:9px 14px;border:1px solid var(--soft);
    border-radius:12px;background:rgba(6,29,20,.85);color:var(--green-soft);text-decoration:none;font-size:14px;font-weight:600}
  .card{margin-top:70px;text-align:center;padding:40px 20px;border:1px solid var(--soft);border-radius:16px;background:rgba(6,29,20,.6)}
  .kick{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);
    border:1px solid var(--soft);border-radius:999px;padding:4px 11px;margin-bottom:14px}
  h1{margin:.2em 0 .3em;font-size:1.5rem}
  p{color:var(--mut);font-size:.95rem;max-width:440px;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr;&nbsp;Beyond the Highway</a>
  <div class="card">
    <span class="kick">Coming Soon</span>
    <h1>Aboriginal Experiences</h1>
    <p>We're building out a dedicated section for Indigenous culture, history and experiences across Wood Buffalo. Check back soon.</p>
  </div>
</div>
<script src="visitor-tracker.js" defer></script>
</body>
</html>
